<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes do Veículo | Vittorio Motori</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/veiculo.css">
</head>
<!-- Esta página não está no menu, então o data-pagina avisa para destacar "Estoque" -->
<body data-pagina="estoque">
  <!-- O menu vem de componentes/header.html -->
  <div data-componente="header"></div>

  <main class="container">
    <nav class="veiculo-breadcrumb" aria-label="Você está em">
      <a href="estoque.html">Estoque</a> / <span id="veiculo-crumb"></span>
    </nav>

    <p id="veiculo-erro" class="veiculo-erro" hidden>Veículo não encontrado. <a href="estoque.html">Voltar ao estoque</a></p>

    <section id="veiculo-conteudo" class="veiculo-grid">
      <div class="veiculo-galeria">
        <figure class="veiculo-principal">
          <img id="veiculo-foto" alt="">
          <figcaption>Foto principal</figcaption>
        </figure>
        <div id="veiculo-thumbs" class="veiculo-thumbs"></div>
      </div>

      <div class="veiculo-info">
        <div class="veiculo-selos">
          <span class="veiculo-selo" id="veiculo-selo"></span>
          <span class="veiculo-selo veiculo-selo-status" id="veiculo-status"></span>
        </div>
        <h1 id="veiculo-titulo"></h1>
        <p class="veiculo-resumo" id="veiculo-resumo"></p>
        <p class="veiculo-preco-label">Preço</p>
        <p class="veiculo-preco" id="veiculo-preco"></p>

        <a id="veiculo-testdrive" class="btn btn-primary" href="teste-drive.html">Agendar test drive →</a>
        <a id="veiculo-whats" class="btn btn-outline" href="#" target="_blank" rel="noopener">Falar no WhatsApp</a>

        <section class="veiculo-ficha-box" aria-labelledby="ficha-titulo">
          <h2 id="ficha-titulo">Ficha técnica</h2>
          <dl id="veiculo-ficha"></dl>
        </section>
      </div>
    </section>

    <section class="veiculo-detalhes" aria-labelledby="detalhes-titulo">
      <h2 id="detalhes-titulo">Especificações <em>completas</em></h2>
      <dl id="veiculo-detalhes"></dl>
    </section>
  </main>

  <!-- O rodapé vem de componentes/footer.html -->
  <div data-componente="footer"></div>

  <script src="js/componentes.js"></script>
  <script src="js/main.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/veiculo.js"></script>
</body>
</html>
