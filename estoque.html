<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estoque | Vittorio Motori</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- O "opsz" deixa a DM Sans mais apertada nos títulos grandes, igual ao Figma -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet" />
    <!-- Primeiro o estilo global, depois o da página -->
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/estoque.css" />
  </head>
  <body>
    <!-- O menu vem de componentes/header.html -->
    <div data-componente="header"></div>

    <main>
      <section class="estoque-titulo">
        <div class="container">
          <p class="estoque-rotulo">Estoque</p>
          <h1>Nosso <em>estoque</em></h1>
          <p class="estoque-descricao">
            Busque pelo modelo e use os filtros de marca, categoria, condição e
            preço para encontrar o carro certo.
          </p>
        </div>
      </section>

      <div class="container estoque-conteudo">
        <!-- Busca e ordenação. O form="filtros" liga o campo de busca ao
             formulário lá de baixo, mesmo estando fora dele. Assim o botão
             "Limpar" apaga a busca junto com os filtros. -->
        <div class="estoque-barra">
          <label class="estoque-busca">
            <span class="so-leitor">Buscar pelo modelo</span>
            <img src="img/icones/busca.svg" alt="" />
            <input type="search" name="busca" form="filtros" placeholder="Buscar pelo modelo..." autocomplete="off" />
          </label>

          <!-- A ordenação fica fora do formulário de propósito: limpar os
               filtros não deve bagunçar a ordem que a pessoa escolheu. -->
          <select id="ordenar" class="estoque-ordenar" aria-label="Ordenar por">
            <option value="menor">Menor preço</option>
            <option value="maior">Maior preço</option>
          </select>

          <!-- Só aparece no celular e no tablet -->
          <button type="button" id="filtros-abrir" class="btn filtros-abrir" aria-expanded="false" aria-controls="filtros">
            Mostrar filtros
          </button>
        </div>

        <div id="estoque-grade" class="estoque-grade">
          <form id="filtros" class="filtros">
            <div class="filtros-topo">
              <h2>Filtros</h2>
              <button type="button" class="filtros-limpar" data-limpar>Limpar</button>
            </div>

            <!-- As marcas e categorias são criadas pelo js/estoque.js, a
                 partir dos carros que existem no dados.js -->
            <fieldset class="filtros-grupo">
              <legend class="estoque-rotulo">Marca</legend>
              <div id="filtro-marcas" class="filtros-lista"></div>
            </fieldset>

            <fieldset class="filtros-grupo">
              <legend class="estoque-rotulo">Categoria</legend>
              <div id="filtro-categorias" class="filtros-chips"></div>
            </fieldset>

            <fieldset class="filtros-grupo">
              <legend class="estoque-rotulo">Condição</legend>
              <div class="filtros-chips">
                <label class="chip"><input type="checkbox" name="condicao" value="Novo" /><span>Novo</span></label>
                <label class="chip"><input type="checkbox" name="condicao" value="Seminovo" /><span>Seminovo</span></label>
              </div>
            </fieldset>

            <fieldset class="filtros-grupo">
              <legend class="estoque-rotulo">Faixa de preço</legend>
              <div class="filtros-precos">
                <output id="preco-min-texto"></output>
                <output id="preco-max-texto"></output>
              </div>
              <!-- O HTML não tem um controle com duas bolinhas, então são dois
                   controles normais, um em cima do outro. O visual da barra
                   fica por conta do CSS. -->
              <div id="faixa" class="faixa">
                <input type="range" id="preco-min" name="precoMin" min="0" step="1" aria-label="Preço mínimo" />
                <input type="range" id="preco-max" name="precoMax" min="0" step="1" aria-label="Preço máximo" />
              </div>
            </fieldset>
          </form>

          <!-- Resultados (os cards são criados pelo js/estoque.js) -->
          <section class="listagem" aria-label="Veículos encontrados">
            <div id="listagem-topo" class="listagem-topo">
              <p id="listagem-total" role="status"></p>
              <p id="listagem-ordem"></p>
            </div>

            <div id="listagem-carros" class="listagem-carros"></div>

            <div id="listagem-vazia" class="listagem-vazia" hidden>
              <span class="listagem-vazia-icone"><img src="img/icones/busca-grande.svg" alt="" /></span>
              <h2>Nenhum veículo <em>encontrado</em></h2>
              <p>Tente buscar por outro modelo ou limpe os filtros para ver todo o estoque.</p>
              <button type="button" class="btn btn-primary" data-limpar>Limpar filtros</button>
            </div>
          </section>
        </div>
      </div>
    </main>

    <!-- O rodapé vem de componentes/footer.html -->
    <div data-componente="footer"></div>

    <script src="js/componentes.js"></script>
    <script src="js/dados.js"></script>
    <script src="js/estoque.js"></script>
  </body>
</html>
